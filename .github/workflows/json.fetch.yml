name: Update AtCoder Problems JSON

on:
  schedule:
    - cron: "17 0 * * 1"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-atcoder-problems-json
  cancel-in-progress: false

jobs:
  update-json:
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Update AtCoder data
        working-directory: backend/data
        run: node json_fetch.mjs

      - name: Run Backend tests
        working-directory: backend
        run: cargo test --locked

      - name: Commit changes if updated
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            backend/data/problems.json \
            backend/data/problem-models.json

          if git diff --cached --quiet; then
            echo "No changes in JSON files"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update AtCoder problem data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up flyctl
        if: steps.commit.outputs.changed == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        if: steps.commit.outputs.changed == 'true'
        working-directory: backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
