[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "0.14", features = ["full"] }
chrono = "0.4.41"
url = "2.2"
rand = "0.8"
serde = { "version" = "1.0", features = ["derive"] }
serde_json = "1.0.142"

[[bin]]
name = "backend"
path = "src/main.rs"
